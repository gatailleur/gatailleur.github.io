baseURL = "https://gabriel-tailleur.com/"
languageCode = "en-us"
title = "Gabriel Tailleur"
theme = "PaperMod"

# New Hugo pagination syntax
[pagination]
  pagerSize = 10

enableRobotsTXT = true

# Allow raw HTML in Markdown (so <img src="/images/me.jpg"> works)
[markup]
  [markup.goldmark.renderer]
    unsafe = true

# PaperMod general params (feel free to adjust later)
[params]
  defaultTheme = "light"
  description = "Postdoctoral researcher in economics at the PcEn Chair, Paris 1 Panthéon-Sorbonne University. Research in natural language processing, political economy, and cinema."
  disableSpecial1stPost = true  # hides the big first-post card on home
  showReadingTime = false
  comments = false
  ShowBreadCrumbs = false

[menu]
  [[menu.main]]
    name = "Research"
    url = "/publications/"   # keep using your Publications section, labeled as Research
    weight = 1

  [[menu.main]]
    name = "Talks"
    url = "/talks/"
    weight = 2

  [[menu.main]]
    name = "Teaching"
    url = "/teaching/"
    weight = 3

  [[menu.main]]
    name = "CV"
    url = "https://drive.google.com/file/d/1pzctGp7G6K8hUb-d9MPtJI8FOxiZNlN2/view?usp=sharing"
    weight = 4
